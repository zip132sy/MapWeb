# MapWeb 配置文件
# 配置结构变更时，此版本号会提升；若与插件代码期望不一致，OP 进服会收到提示。
config-version: 8

web:
  # 网页服务端口
  port: 8123
  # 是否自动检测可用端口：true 时若 port 被占用，会从 port 开始向后寻找可用端口
  auto-port: true
  # 默认刷新间隔（秒），网页上可实时修改
  refresh-interval: 5
  # 刷新间隔允许的最小值（秒）
  min-refresh-interval: 1
  # 刷新间隔允许的最大值（秒）
  max-refresh-interval: 300

map:
  # 是否显示所有已加载的世界（false 时只显示 default-world）
  show-all-worlds: true
  # 默认显示的世界名
  default-world: world
  # 渲染分辨率：每个区块渲染成 resolution × resolution 像素
  # 数值越大越清晰，但渲染越慢。8 适合大多数场景，16 更清晰，32+ 会明显变慢
  # 注意：分辨率过高 + 大量已加载区块，会导致单次渲染耗时很长
  resolution: 8
  # 是否在地图上绘制区块边界线
  show-chunk-border: true

# ============================================================
# 真 3D 视图（Three.js）
# 以指定中心点周围 N 个区块为范围，渲染立体地形，可看到实体的 Z 轴高度。
# 注意：范围越大，方块数据越多，前端渲染越吃性能。建议 3~5。
# ============================================================
three-d:
  # 是否启用 3D 视图
  enabled: true
  # 渲染半径（区块数）：以中心点周围 radius 个区块为范围
  # 3 表示 7×7=49 个区块，5 表示 11×11=121 个区块
  radius: 3
  # 扫描的最低高度
  min-y: 0
  # 扫描的最高高度（越低数据越少，建议 128 以内）
  max-y: 128
  # 单次返回的最大方块数量上限（防止数据量爆炸）
  max-voxels: 120000
  # 材质包下载地址列表：插件启动时若未找到 textures.zip，会依次尝试这些地址
  # 第一个失败就试下一个，全部失败则使用纯色渲染
  # 下载后保存为 plugins/MapWeb/textures.zip，之后不再重复下载
  # 留空则不下载。也可用命令手动下载：/mapweb downloadtextures <url>
  # 若自动下载失败，请手动把材质包重命名为 textures.zip 放到 plugins/MapWeb/ 目录
  texture-download-urls:
    - 'https://github.com/InventivetalentDev/minecraft-assets/archive/refs/heads/1.12.2.zip'

# ============================================================
# 在线玩家列表
# 网页顶部显示在线人数，点击可展开玩家头像列表。
# 头像通过第三方 API（mc-heads.net）加载，需要客户端能访问外网。
# ============================================================
player-list:
  # 是否启用玩家列表功能
  enabled: true
  # 是否显示玩家所在世界
  show-world: true
  # 是否显示玩家坐标
  show-coords: true
  # 是否显示玩家血量
  show-health: true
  # 是否显示玩家饱食度
  show-food: true
  # 是否排除假玩家（NPC / 机器人）
  # 通过 getAddress() == null 判断，可识别 Citizens 等插件生成的 NPC
  exclude-fake-players: true

# ============================================================
# 地图生物显示
# 在地图上以彩色圆点标记生物位置。
# 颜色：友好=绿，中立=黄，敌对=红。
# 默认全部关闭，需要手动开启。三类可独立开关，随意搭配。
# 注意：扫描生物有一定性能开销，生物较多时建议调大刷新间隔。
# ============================================================
entity-display:
  # 总开关：是否启用生物显示（默认关闭）
  enabled: false
  # 是否显示友好生物（动物，如牛、羊、猪）
  show-friendly: false
  # 是否显示中立生物（如末影人、蜘蛛、狼）
  show-neutral: false
  # 是否显示敌对生物（如僵尸、骷髅、苦力怕）
  show-hostile: false

# ============================================================
# 网页命令行工具（高危功能，请谨慎使用）
# 开启后，网页上登录管理员账号即可执行白名单内的服务器命令。
# 管理员账号通过服务器控制台命令创建：
#   /mapweb admin add <用户名> <密码>
# 强烈建议：仅在可信网络环境下开启，并严格限制命令白名单。
# ============================================================
web-console:
  # 是否启用网页命令行功能
  enabled: true
  # 登录会话有效期（分钟），超时需重新登录
  session-timeout: 30
  # 允许通过网页执行的命令白名单（只写命令名，不含斜杠）
  # 只有在此列表中的命令才允许执行，其它一律拒绝
  command-whitelist:
    - say
    - list
    - tps
    - time
    - weather
